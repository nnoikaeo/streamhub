name: Docs

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '**/*.md'
      - 'scripts/check-doc-links.mjs'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/docs.yml'
  push:
    branches: [main, develop]
    paths:
      - '**/*.md'
      - 'scripts/check-doc-links.mjs'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  docs:
    name: Lint and link-check docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # No `npm ci`: check-doc-links uses node builtins and git, and docs:lint
      # runs a pinned markdownlint through npx. Neither needs the project tree.
      - name: Check Markdown links
        run: npm run docs:links

      - name: Lint Markdown
        run: npm run docs:lint
